<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yave</title>
  <meta name="description" content="Yave. Clothing made to fit.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html" aria-label="Yave home"><img src="logo.png" alt="yave" width="606" height="261"></a>
    <nav aria-label="Main">
      <a href="#shop">Shop</a>
    </nav>
  </header>

  <main>

    <section class="shop" id="shop" aria-label="Products">
      <div class="grid" data-shop></div>
      <div class="band drop" id="drop" data-empty hidden>
        <h2>The first drop is being made</h2>
        <p>No products yet. Join the list and you'll hear first when they go live.</p>
        <form class="waitlist" id="waitlist" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <label class="sr" for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@email.com">
          <button class="btn" type="submit">Join the list</button>
        </form>
        <p class="note" id="waitlist-note" role="status"></p>
      </div>
    </section>
  </main>

  <footer data-footer></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
